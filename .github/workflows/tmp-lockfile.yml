# TEMPORARY — regenerates package-lock.json with @typescript-eslint/parser and
# reports lint + unit test results. Deleted right after use.
name: tmp-lockfile
on:
  push:
    branches: [tmp/lockfile-update]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm install --save-dev @typescript-eslint/parser@^8
      - name: Print lockfile patch
        run: |
          git diff -- package.json package-lock.json > lock.patch
          echo "PATCH_SHA256 $(sha256sum lock.patch | cut -d' ' -f1)"
          echo "=====BEGIN====="
          gzip -9c lock.patch | base64 -w 120
          echo "=====END====="
